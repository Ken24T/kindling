name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify-and-build:
    name: Verify tag and build release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Single version source: [workspace.package] version in the root Cargo.toml
          CARGO_VERSION=$(grep -A1 '^\[workspace\.package\]' Cargo.toml \
            | grep '^version' \
            | head -1 \
            | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$CARGO_VERSION" ]; then
            echo "Could not read version from [workspace.package] in Cargo.toml" >&2
            exit 1
          fi
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG) does not match Cargo.toml ($CARGO_VERSION)" >&2
            exit 1
          fi
          echo "Tag v$TAG matches Cargo.toml $CARGO_VERSION"

      - name: Test
        run: cargo test

      - name: Release build
        run: cargo build --release
